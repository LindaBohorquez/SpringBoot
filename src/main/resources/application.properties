# Nombre de la aplicaci n
spring.application.name=demo

# Puerto del servidor
server.port=4000

# Configuraci n de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Valentina_6
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.hibernate.envers.global_with_modified_flag=true
