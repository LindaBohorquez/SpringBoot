# Nombre de la aplicación
spring.application.name=demo

# Puerto del servidor
server.port=4000

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3308/demo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Valentina_6
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.hibernate.envers.global_with_modified_flag=true

# Configuración de Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
